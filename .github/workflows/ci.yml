name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest, compileall, configure_mappers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Mirrors docker-compose.yml (same image/credentials) used for local
      # dev. POSTGRES_DB is the test database name, not the dev one --
      # backend/tests/conftest.py hardcodes DATABASE_URL to
      # postgresql+psycopg2://postgres:postgres@localhost:5432/ai_commerce_os_test
      # and creates tables itself via Base.metadata.create_all() (see the
      # session-scoped `engine` fixture) rather than via Alembic, so the
      # only thing this job needs to provide is a reachable, empty
      # database with that name -- pytest handles the rest.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_commerce_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Belt-and-suspenders alongside conftest.py's own hardcoded value
      # above: harmless if conftest.py always overrides it, and keeps this
      # workflow correct on its own if that ever changes to respect an
      # already-set value instead.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ai_commerce_os_test
      # backend/.env is gitignored, so it doesn't exist on the runner --
      # Settings.cookie_secure defaults to True (correct for real
      # deployments), which marks the session cookie Secure and makes it
      # get silently dropped over the TestClient's plain http://, failing
      # every test that logs in and then calls an authenticated endpoint.
      # Locally, backend/.env sets COOKIE_SECURE=false for the same
      # http-only-dev reason (see backend/.env.example) -- this mirrors
      # that here. The Settings default itself stays True; this is a
      # CI-environment-only override, not a production behavior change.
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile-check application package
        run: python -m compileall -q app

      - name: Verify SQLAlchemy mappers configure cleanly
        run: |
          python -c "
          from app.db.base import Base
          from sqlalchemy.orm import configure_mappers
          import app.models
          configure_mappers()
          print('configure_mappers OK')
          "

  frontend:
    name: Frontend (vitest, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
